function celebBase() {
  const c = document.createElement('canvas'); c.width = 270; c.height = 180; const g = c.getContext('2d'), H = 180;
  g.fillStyle = '#E30A17'; g.fillRect(0, 0, 270, H);
  g.fillStyle = '#fff'; g.beginPath(); g.arc(0.5 * H, H / 2, 0.25 * H, 0, 7); g.fill(); // hilalin dış dairesi
  g.fillStyle = '#E30A17'; g.beginPath(); g.arc(0.5 * H + 0.0625 * H, H / 2, 0.2 * H, 0, 7); g.fill(); // iç daire
  const cx = 0.5 * H + 0.3 * H + 0.1 * H, cy = H / 2, R = 0.125 * H; // beş köşeli yıldız, bir ucu sağa bakar
  g.fillStyle = '#fff'; g.beginPath();

  g.closePath(); g.fill();

}
function celebFrame(ts) {

  g.clearRect(0, 0, W, H);

    g.drawImage(celeb.base, x, 0, step, H, x, 12 + dy, step, H - 24);
