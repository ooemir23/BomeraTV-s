<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TV</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap');
:root{--bg:#1b1d1d;--card:rgba(255,255,255,.045);--line:rgba(255,255,255,.09);--white:#FBFBFB;--soft:#E5E5E5;--mute:#9aa0a0;--accent:#906538;--accent2:#c9955c;--live:#ff4d4d}
*{box-sizing:border-box;margin:0}
html,body{height:100%;width:100%;background:var(--bg);color:var(--white);font-family:Montserrat,system-ui,sans-serif;overflow:hidden;cursor:none}
#app{display:grid;grid-template-columns:1fr 28vw;grid-template-rows:minmax(0,1fr) 6.5vh;height:100vh;height:100dvh;background:radial-gradient(110% 90% at 15% 0%,#2c3030 0%,#1b1d1d 65%)}
#stage{padding:2.4vh 1vw 2.4vh 2vw;display:flex;min-height:0;min-width:0;overflow:hidden}
#frame{flex:1;position:relative;border-radius:18px;padding:.6vh;background:linear-gradient(145deg,rgba(201,149,92,.7),rgba(144,101,56,.15) 40%,rgba(201,149,92,.5));box-shadow:0 3vh 8vh rgba(0,0,0,.65)}
#bgw{position:absolute;inset:.6vh;border-radius:15px;overflow:hidden;background:#1b1d1d}
#bgc{width:100%;height:100%;display:block;filter:blur(2.4vh) saturate(1.1) brightness(.62);transform:scale(1.35)}
#bgw::after{content:"";position:absolute;inset:0;background:linear-gradient(145deg,rgba(144,101,56,.30),rgba(27,29,29,.38))}
video,#img{position:absolute;inset:.6vh;width:calc(100% - 1.2vh);height:calc(100% - 1.2vh);object-fit:contain;background:transparent;border-radius:15px;display:block}
#img{display:none}
#side{padding:2.4vh 2vw 2.4vh 1vw;display:flex;flex-direction:column;gap:2.2vh;min-height:0}
#logo{width:100%;aspect-ratio:1285/327;background:url(/logo.png) center/100% 100% no-repeat;border-radius:12px;flex:none;box-shadow:0 1vh 3vh rgba(0,0,0,.4)}
#matches{flex:1;min-height:0;display:flex;flex-direction:column}
#mhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.6vh;padding:0 .3vw}
#mhead h2{font-size:1.7vh;font-weight:600;letter-spacing:.32em;text-transform:uppercase;color:var(--soft)}
#dots{display:flex;gap:.45vw}
#dots i{width:.55vw;height:.55vw;border-radius:50%;background:rgba(255,255,255,.2);transition:.4s}
#dots i.on{background:var(--accent2);width:1.5vw;border-radius:1vw}
#mbody{flex:1;min-height:0;position:relative}
#list{position:absolute;inset:0;overflow:hidden;display:flex;flex-direction:column;gap:1vh;transition:opacity .45s,transform .45s}
#list.out,#traffic.out{opacity:0;transform:translateY(1.2vh)}
#traffic{position:absolute;inset:0;overflow:hidden;border-radius:14px;border:1px solid rgba(201,149,92,.4);visibility:hidden;background:#cfe3ee;transition:opacity .45s,transform .45s}
#traffic iframe{position:absolute;width:1600px;height:1600px;left:50%;top:50%;margin:-800px 0 0 -800px;border:0;pointer-events:none}
#tlegend{position:absolute;left:1vw;right:1vw;bottom:1.2vh;background:rgba(27,29,29,.82);border-radius:10px;padding:.8vh .9vw;display:flex;align-items:center;gap:.8vw;font-size:1.25vh;letter-spacing:.12em;text-transform:uppercase;color:var(--soft);font-weight:600}
#tlegend i{flex:1;height:.9vh;border-radius:1vh;background:linear-gradient(90deg,#3ecf4a,#f2c230,#ee3b2f,#8b1a14)}
.m{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:.9vh .9vw;flex:none;display:flex;flex-direction:column;gap:.4vh}
.m .top{display:flex;justify-content:space-between;align-items:center;font-size:1.15vh;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);font-weight:500}
.pill{font-weight:600;letter-spacing:.08em;padding:.2vh .55vw;border-radius:2vh;background:rgba(255,255,255,.08);color:var(--soft);font-size:1.15vh;white-space:nowrap}
.pill.live{background:rgba(255,77,77,.16);color:var(--live)}
.pill.live::before{content:"";display:inline-block;width:.5vh;height:.5vh;margin-right:.5vw;border-radius:50%;background:var(--live);animation:pulse 1.2s infinite}
.pill.fin{background:rgba(144,101,56,.25);color:var(--accent2)}
@keyframes pulse{50%{opacity:.25}}
.row{display:flex;justify-content:space-between;align-items:center;font-size:1.9vh;font-weight:500;line-height:1.25;gap:1vw}
.row span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row b{font-weight:700;font-size:2vh;min-width:2ch;text-align:right}
.row.lose{color:var(--mute)}
#rates{flex:none;background:linear-gradient(160deg,rgba(201,149,92,.16),rgba(255,255,255,.03));border:1px solid rgba(201,149,92,.35);border-radius:16px;padding:1.4vh 1vw 1.2vh}
#rhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:1.1vh;font-size:1.2vh;letter-spacing:.3em;text-transform:uppercase;color:var(--soft);font-weight:600}
#rhead small{letter-spacing:.08em;color:var(--mute);font-weight:400;text-transform:none;font-size:1.2vh}
#rgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:.7vw}
.rt{background:rgba(0,0,0,.28);border:1px solid var(--line);border-radius:12px;padding:1.2vh .3vw 1.1vh;text-align:center}
.ic{width:4.2vh;height:4.2vh;margin:0 auto .7vh;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:2.2vh;font-weight:600;color:#1b1d1d;background:linear-gradient(145deg,#e6b87d,#906538)}
.rt small{display:block;font-size:1.2vh;letter-spacing:.25em;color:var(--accent2);font-weight:600;margin-bottom:.4vh}
.rt strong{font-size:2.6vh;font-weight:600;white-space:nowrap}
.rt strong i{font-style:normal;font-size:1.6vh;color:var(--mute);margin-left:.2vw;font-weight:400}
#ticker{grid-column:1/3;display:flex;align-items:stretch;background:linear-gradient(180deg,#171919,#0e0f0f);border-top:1px solid rgba(201,149,92,.55);overflow:hidden;position:relative}
#tlabel{flex:none;display:flex;align-items:center;gap:.7vw;padding:0 2vw;background:linear-gradient(90deg,#906538,#b07a45);color:#fff;font-size:2vh;font-weight:700;letter-spacing:.22em;text-transform:uppercase;position:relative;z-index:2;box-shadow:1vw 0 2vw rgba(0,0,0,.5)}
#tlabel::before{content:"";width:1vh;height:1vh;border-radius:50%;background:#fff;animation:pulse 1.2s infinite}
#tview{flex:1;overflow:hidden;display:flex;align-items:center;mask-image:linear-gradient(90deg,transparent,#000 3%,#000 97%,transparent)}
#ttrack{display:flex;flex:none;white-space:nowrap;animation:tscroll 60s linear infinite;will-change:transform}
#ttrack>div{display:flex;align-items:center;flex:none}
@keyframes tscroll{to{transform:translateX(-50%)}}
.ti{display:flex;align-items:center;gap:.8vw;font-size:2.7vh;font-weight:500;padding:0 2.4vw;color:var(--white)}
.ti .lg{font-size:1.6vh;letter-spacing:.2em;color:var(--accent2);font-weight:600;text-transform:uppercase}
.ti .sc{font-weight:700;background:rgba(255,255,255,.1);padding:.3vh 1vw;border-radius:1vh;font-size:2.7vh}
.ti .lv{color:#ff5a5a;font-weight:600;font-size:1.8vh;letter-spacing:.08em}
.ti .ft{color:var(--mute);font-size:1.8vh;letter-spacing:.08em}
.ti::after{content:"◆";color:var(--accent);font-size:1.3vh;margin-left:2.4vw}
#bday{position:fixed;left:0;right:0;bottom:0;height:11vh;background:linear-gradient(90deg,#4a2f18,var(--accent) 50%,#4a2f18);border-top:1px solid var(--soft);display:none;align-items:center;overflow:hidden;z-index:5}
#bday.on{display:flex}
#bday p{white-space:nowrap;font-size:5.4vh;font-weight:600;color:var(--white);padding-left:100%;animation:slide var(--d,20s) linear infinite}
@keyframes slide{to{transform:translateX(-100%)}}
</style></head><body>
<div id="app">
  <div id="stage"><div id="frame"><div id="bgw"><canvas id="bgc"></canvas></div><video id="v" autoplay muted playsinline></video><img id="img" alt=""></div></div>
  <div id="side">
    <div id="logo"></div>
    <div id="matches"><div id="mhead"><h2 id="mtitle">Maçlar</h2><div id="dots"></div></div><div id="mbody"><div id="list"></div><div id="traffic"><iframe loading="eager" referrerpolicy="no-referrer"></iframe><div id="tlegend"><span>Akıcı</span><i></i><span>Yoğun</span></div></div></div></div>
    <div id="rates"></div>
  </div>
  <div id="ticker"><div id="tlabel"><span id="tl">Canlı Skorlar</span></div><div id="tview"><div id="ttrack"><div id="ta"></div><div id="tb"></div></div></div></div>
</div>
<div id="bday"><p id="btxt"></p></div>
<script>
const v = document.getElementById('v'), img = document.getElementById('img');
let videos = [], idx = 0, current = null, imageSeconds = 10, timer;
function next() { clearTimeout(timer); idx++; play(); }
function play() {
  clearTimeout(timer);
  if (!videos.length) return;
  idx %= videos.length;
  const it = videos[idx];
  current = it.id;
  if (it.type === 'image') {
    v.pause(); v.style.display = 'none'; img.style.display = 'block'; img.src = it.url;
    timer = setTimeout(next, imageSeconds * 1000);
  } else {
    img.style.display = 'none'; v.style.display = 'block'; v.src = it.url;
    v.loop = videos.length === 1;
    v.play().catch(() => {});
  }
}
const bgc = document.getElementById('bgc'), bctx = bgc.getContext('2d');
function sizeBg() { const f = document.getElementById('frame'); bgc.width = 64; bgc.height = Math.max(8, Math.round(64 * f.clientHeight / Math.max(1, f.clientWidth))); }
function drawBg(src, iw, ih) {
  if (!iw || !ih) return;
  const s = Math.max(bgc.width / iw, bgc.height / ih), w = iw * s, hh = ih * s;
  bctx.drawImage(src, (bgc.width - w) / 2, (bgc.height - hh) / 2, w, hh);
}
sizeBg();
addEventListener('resize', () => { sizeBg(); if (img.style.display === 'block') drawBg(img, img.naturalWidth, img.naturalHeight); });
img.addEventListener('load', () => drawBg(img, img.naturalWidth, img.naturalHeight));
setInterval(() => { if (v.style.display !== 'none' && !v.paused && v.readyState >= 2) drawBg(v, v.videoWidth, v.videoHeight); }, 250);
v.addEventListener('ended', next);
v.addEventListener('error', () => { clearTimeout(timer); timer = setTimeout(next, 2000); });

const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let PER_PAGE = 5; const PAGE_MS = 9000, TRAFFIC_MS = 14000;
const TRAFFIC_URL = 'https://yandex.com.tr/map-widget/v1/?ll=28.95%2C41.04&z=10&l=map%2Ctrf&lang=tr_TR';
const PIN = new URLSearchParams(location.search).get('p');
let matches = [], page = 0, pages = [], rot, trafficLoaded = 0;
function card(m) {
  const hasScore = m.hs != null;
  const hw = hasScore && +m.hs > +m.as, aw = hasScore && +m.as > +m.hs;
  const left = m.live ? 'Canlı' : m.final ? esc(m.day) : esc(m.day);
  const pill = m.live ? `<span class="pill live">CANLI ${esc(m.clock || '')}</span>`
    : m.final ? '<span class="pill fin">MS</span>'
    : `<span class="pill">${esc(m.time)}</span>`;
  const sc = x => hasScore ? `<b>${esc(x)}</b>` : '';
  return `<div class="m"><div class="top"><span>${left}</span>${pill}</div>
    <div class="row ${m.final && aw ? 'lose' : ''}"><span>${esc(m.home)}</span>${sc(m.hs)}</div>
    <div class="row ${m.final && hw ? 'lose' : ''}"><span>${esc(m.away)}</span>${sc(m.as)}</div></div>`;
}
function fit() {
  const list = document.getElementById('list');
  list.style.display = 'flex';
  list.innerHTML = card({home: 'x', away: 'x', hs: 0, as: 0, final: true, day: 'x'});
  const ch = list.firstElementChild.getBoundingClientRect().height + 2;
  const gap = parseFloat(getComputedStyle(list).rowGap) || 0;
  PER_PAGE = Math.max(1, Math.floor((list.clientHeight + gap) / (ch + gap)));
}
function buildPages() {
  const groups = new Map();
  for (const m of matches) { if (!groups.has(m.league)) groups.set(m.league, []); groups.get(m.league).push(m); }
  pages = [];
  for (const [league, items] of groups)
    for (let i = 0; i < items.length; i += PER_PAGE) pages.push({ type: 'league', league, items: items.slice(i, i + PER_PAGE) });
  if (!pages.length) pages.push({ type: 'empty' });
  pages.push({ type: 'traffic' });
}
function loadTraffic() {
  const f = document.querySelector('#traffic iframe');
  f.src = TRAFFIC_URL; trafficLoaded = Date.now();
}
loadTraffic();
setInterval(() => { if (pages[page] && pages[page].type !== 'traffic') loadTraffic(); }, 4 * 60 * 1000);
function render() {
  const list = document.getElementById('list'), tr = document.getElementById('traffic'), dots = document.getElementById('dots');
  if (!window.fitted) { fit(); window.fitted = true; }
  buildPages();
  page = PIN === 'traffic' ? pages.length - 1 : page % pages.length;
  const pg = pages[page];
  const isTraffic = pg.type === 'traffic';
  tr.style.visibility = isTraffic ? 'visible' : 'hidden';
  list.style.display = isTraffic ? 'none' : 'flex';
  document.getElementById('mtitle').textContent = isTraffic ? 'İstanbul Trafik' : pg.type === 'empty' ? 'Maçlar' : pg.league;
  if (pg.type === 'league') list.innerHTML = pg.items.map(card).join('');
  else if (pg.type === 'empty') list.innerHTML = '<div class="m"><div class="top"><span>Yakında maç yok</span></div></div>';
  dots.innerHTML = pages.length > 1 ? pages.map((_, i) => `<i class="${i === page ? 'on' : ''}"></i>`).join('') : '';
}
function tick() {
  if (PIN) return;
  const el = document.getElementById(pages[page]?.type === 'traffic' ? 'traffic' : 'list');
  el.classList.add('out');
  setTimeout(() => { page++; render(); el.classList.remove('out'); schedule(); }, 450);
}
function schedule() {
  clearTimeout(rot);
  rot = setTimeout(tick, pages[page]?.type === 'traffic' ? TRAFFIC_MS : PAGE_MS);
}
addEventListener('resize', () => { fit(); render(); });
function setMatches(list) {
  const same = JSON.stringify(list) === JSON.stringify(matches);
  matches = list;
  if (!same || !pages.length) { render(); if (!rot) schedule(); }
}
let tickKey = '';
function setTicker(list) {
  const live = list.filter(m => m.live), fin = list.filter(m => m.final);
  const shown = live.length || fin.length ? [...live, ...fin] : list.slice(0, 8);
  const label = live.length ? 'Canlı Skorlar' : fin.length ? 'Günün Sonuçları' : 'Sıradaki Maçlar';
  const items = shown.map(m => {
    const mid = m.hs != null ? `<span class="sc">${esc(m.hs)} - ${esc(m.as)}</span>` : '<span class="ft">vs</span>';
    const tag = m.live ? `<span class="lv">● ${esc(m.clock || 'CANLI')}</span>` : m.final ? '<span class="ft">MS</span>' : `<span class="ft">${esc(m.day)} ${esc(m.time)}</span>`;
    return `<span class="ti"><span class="lg">${esc(m.league)}</span><span>${esc(m.home)}</span>${mid}<span>${esc(m.away)}</span>${tag}</span>`;
  }).join('') || '<span class="ti"><span class="ft">Şu an gösterilecek maç yok</span></span>';
  document.getElementById('tl').textContent = label;
  const a = document.getElementById('ta'), b = document.getElementById('tb'), track = document.getElementById('ttrack');
  // tek kopya ekrandan kısaysa çoğalt ki boşluk kalmasın
  a.innerHTML = items; 
  const view = document.getElementById('tview').clientWidth;
  let reps = Math.max(1, Math.ceil(view / Math.max(1, a.scrollWidth)));
  a.innerHTML = items.repeat(reps); b.innerHTML = items.repeat(reps);
  const secs = Math.max(20, a.scrollWidth / (innerWidth * 0.055));
  const key = shown.map(m => m.id).join() + label;
  if (key !== tickKey) { tickKey = key; track.style.animation = 'none'; void track.offsetWidth; track.style.animation = ''; }
  track.style.animationDuration = secs + 's';
}
function setState(s) {
  const ids = s.videos.map(x => x.id).join();
  const changed = ids !== videos.map(x => x.id).join();
  videos = s.videos; imageSeconds = s.imageSeconds || 10;
  if (changed) { const k = videos.findIndex(x => x.id === current); idx = k >= 0 ? k : 0; if (k < 0) play(); }
  if (current === null && videos.length) play();
  setMatches(s.matches);
  setTicker(s.matches);
  setRates(s.rates);
}
function setRates(r) {
  const f = (x, d = 2) => x ? x.toLocaleString('tr-TR', {minimumFractionDigits: d, maximumFractionDigits: d}) : '--';
  const t = r.updated ? new Date(r.updated).toLocaleTimeString('tr-TR', {hour: '2-digit', minute: '2-digit', timeZone: 'Europe/Istanbul'}) : '';
  const tile = (ic, code, val) => `<div class="rt"><div class="ic">${ic}</div><small>${code}</small><strong>${val}<i>₺</i></strong></div>`;
  document.getElementById('rates').innerHTML =
    `<div id="rhead"><span>Piyasalar</span><small>${t ? 'Güncelleme ' + t : ''}</small></div><div id="rgrid">` +
    tile('$', 'DOLAR', f(r.usd)) + tile('€', 'EURO', f(r.eur)) + tile('Au', 'GR ALTIN', f(r.gold, 0)) + '</div>';
}
let bt;
function birthday(names, dur) {
  const b = document.getElementById('bday'), p = document.getElementById('btxt');
  p.textContent = '🎉 Doğum günün kutlu olsun ' + names.join(', ') + '! 🎂';
  p.style.setProperty('--d', Math.max(10, dur / 2) + 's');
  b.classList.remove('on'); void b.offsetWidth; b.classList.add('on');
  clearTimeout(bt); bt = setTimeout(() => b.classList.remove('on'), dur * 1000);
}
function connect() {
  const ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws');
  ws.onmessage = e => {
    const m = JSON.parse(e.data);
    if (m.type === 'version') { if (window.__build && window.__build !== m.build) location.reload(); window.__build = m.build; }
    else if (m.type === 'state') setState(m.state);
    else if (m.type === 'rates') setRates(m.rates);
    else if (m.type === 'birthday') birthday(m.names, m.duration);
  };
  ws.onclose = () => setTimeout(connect, 3000);
}
connect();
</script></body></html>
