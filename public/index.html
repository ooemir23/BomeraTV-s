<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TV</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Montserrat:wght@300;400;600&display=swap');
:root{--gold:#d4af6a;--gold2:#f3dca4;--ink:#0b0907;--panel:#14100c;--muted:#a89878}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--ink);color:#f5ecd9;font-family:Montserrat,system-ui,sans-serif;overflow:hidden;cursor:none}
#app{display:grid;grid-template-columns:1fr 27vw;grid-template-rows:1fr 11vh;height:100vh;gap:0;
background:radial-gradient(120% 120% at 20% 0%,#1d1610 0%,#0b0907 60%)}
#stage{padding:2.2vh 1.2vw 2.2vh 2vw;display:flex}
#frame{flex:1;position:relative;border:1px solid rgba(212,175,106,.55);border-radius:6px;padding:.7vh;
box-shadow:0 0 0 .6vh #0b0907,0 0 0 calc(.6vh + 1px) rgba(212,175,106,.25),0 2vh 6vh rgba(0,0,0,.7)}
video{width:100%;height:100%;object-fit:cover;background:#000;border-radius:3px;display:block}
#matches{padding:2.2vh 2vw 2.2vh .8vw;display:flex;flex-direction:column;overflow:hidden}
#matches h2{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:4vh;color:var(--gold2);text-align:center;
letter-spacing:.18em;text-transform:uppercase;padding-bottom:1.6vh;position:relative;margin-bottom:1.4vh}
#matches h2::after{content:"";position:absolute;left:20%;right:20%;bottom:0;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.m{background:linear-gradient(160deg,rgba(212,175,106,.10),rgba(212,175,106,.02));border:1px solid rgba(212,175,106,.22);
border-radius:4px;padding:1.5vh 1.2vw;margin-bottom:1.4vh}
.m small{display:block;color:var(--muted);font-size:1.5vh;letter-spacing:.2em;text-transform:uppercase}
.m div{font-family:'Cormorant Garamond',serif;font-size:3.1vh;font-weight:600;margin-top:.6vh;line-height:1.15}
.m b{display:block;font-family:Montserrat,sans-serif;font-weight:300;font-size:2.4vh;color:var(--gold);letter-spacing:.12em;margin-bottom:.4vh}
#bar{grid-column:1/3;background:linear-gradient(180deg,#14100c,#080604);border-top:1px solid rgba(212,175,106,.6);position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
#rates{display:flex;gap:9vw;font-size:4.4vh}
#rates span{font-family:'Cormorant Garamond',serif;font-weight:700;color:var(--gold2);letter-spacing:.04em}
#rates span em{font-family:Montserrat,sans-serif;font-style:normal;font-weight:300;font-size:2.4vh;color:var(--gold);letter-spacing:.3em;margin-right:1.2vw}
#bday{position:absolute;inset:0;background:linear-gradient(90deg,#3a0f1e,#7a1f3d 50%,#3a0f1e);border-top:1px solid var(--gold2);display:none;align-items:center;overflow:hidden}
#bday.on{display:flex}
#bday p{white-space:nowrap;font-family:'Cormorant Garamond',serif;font-size:6vh;font-weight:700;color:var(--gold2);padding-left:100%;animation:slide var(--d,20s) linear infinite}
@keyframes slide{to{transform:translateX(-100%)}}
</style></head><body>
<div id="app">
  <div id="stage"><div id="frame"><video id="v" autoplay muted playsinline></video></div></div>
  <div id="matches"><h2>Maç Takvimi</h2><div id="list"></div></div>
  <div id="bar"><div id="rates"></div><div id="bday"><p id="btxt"></p></div></div>
</div>
<script>
const v = document.getElementById('v');
let videos = [], idx = 0, current = null;
function play() {
  if (!videos.length) return;
  idx %= videos.length;
  current = videos[idx].id;
  v.src = videos[idx].url;
  v.play().catch(() => {});
}
v.addEventListener('ended', () => { idx++; play(); });
v.addEventListener('error', () => setTimeout(() => { idx++; play(); }, 2000));
function setState(s) {
  const ids = s.videos.map(x => x.id).join();
  const changed = ids !== videos.map(x => x.id).join();
  videos = s.videos;
  if (changed) { const k = videos.findIndex(x => x.id === current); idx = k >= 0 ? k : 0; if (k < 0) play(); }
  if (!v.src && videos.length) play();
  document.getElementById('list').innerHTML = s.matches.map(m =>
    `<div class="m"><small>${esc(m.league)}</small><div><b>${esc(m.time)}</b>${esc(m.home)} - ${esc(m.away)}</div></div>`).join('')
    || '<div class="m"><small>Bugün maç yok</small></div>';
  setRates(s.rates);
}
function setRates(r) {
  const f = x => x ? x.toFixed(2) : '--';
  document.getElementById('rates').innerHTML = `<span><em>USD</em>${f(r.usd)} ₺</span><span><em>EUR</em>${f(r.eur)} ₺</span>`;
}
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let bt;
function birthday(names, dur) {
  const b = document.getElementById('bday'), p = document.getElementById('btxt');
  p.textContent = '🎉 Doğum günün kutlu olsun ' + names.join(', ') + '! 🎂';
  p.style.setProperty('--d', Math.max(10, dur / 2) + 's');
  b.classList.remove('on'); void b.offsetWidth; b.classList.add('on');
  clearTimeout(bt); bt = setTimeout(() => b.classList.remove('on'), dur * 1000);
}
function connect() {
  const ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws');
  ws.onmessage = e => {
    const m = JSON.parse(e.data);
    if (m.type === 'state') setState(m.state);
    else if (m.type === 'rates') setRates(m.rates);
    else if (m.type === 'birthday') birthday(m.names, m.duration);
  };
  ws.onclose = () => setTimeout(connect, 3000);
}
connect();
</script></body></html>
