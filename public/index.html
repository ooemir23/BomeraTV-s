<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TV</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap');
:root{--bg:#1b1d1d;--card:rgba(255,255,255,.045);--line:rgba(255,255,255,.09);--white:#FBFBFB;--soft:#E5E5E5;--mute:#9aa0a0;--accent:#906538;--accent2:#c9955c;--live:#ff4d4d}
*{box-sizing:border-box;margin:0}
html,body{height:100%;width:100%;background:var(--bg);color:var(--white);font-family:Montserrat,system-ui,sans-serif;overflow:hidden;cursor:none}
#app{display:grid;grid-template-columns:1fr 28vw;grid-template-rows:minmax(0,1fr) auto 6.5vh;height:100vh;height:100dvh;background:radial-gradient(110% 90% at 15% 0%,#2c3030 0%,#1b1d1d 65%)}
#stage{grid-row:1;padding:2.4vh 1vw 1.6vh 2vw;display:flex;min-height:0;min-width:0;overflow:hidden}
#frame{flex:1;position:relative;border-radius:18px;padding:.6vh;background:linear-gradient(145deg,rgba(201,149,92,.7),rgba(144,101,56,.15) 40%,rgba(201,149,92,.5));box-shadow:0 3vh 8vh rgba(0,0,0,.65)}
#bgw{position:absolute;inset:.6vh;border-radius:15px;overflow:hidden;background:#1b1d1d}
#bgc{width:100%;height:100%;display:block;filter:blur(2.4vh) saturate(1.1) brightness(.62);transform:scale(1.35)}
#bgw::after{content:"";position:absolute;inset:0;background:linear-gradient(145deg,rgba(144,101,56,.30),rgba(27,29,29,.38))}
video,#img{position:absolute;inset:.6vh;width:calc(100% - 1.2vh);height:calc(100% - 1.2vh);object-fit:contain;background:transparent;border-radius:15px;display:block}
#img{display:none}
#side{grid-row:1/3;grid-column:2;padding:2.4vh 2vw 2.4vh 1vw;display:flex;flex-direction:column;gap:2.2vh;min-height:0}
#logo{width:100%;aspect-ratio:1285/327;background:url(/logo.png) center/100% 100% no-repeat;border-radius:12px;flex:none;box-shadow:0 1vh 3vh rgba(0,0,0,.4)}
#matches{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}
#mhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.6vh;padding:0 .3vw}
#mhead h2 em{font-style:normal;font-size:1.25vh;color:var(--accent2);letter-spacing:.2em;margin-left:.8vw;font-weight:600}
#mhead h2{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;font-size:1.7vh;font-weight:600;letter-spacing:.32em;text-transform:uppercase;color:var(--soft)}
#dots{display:flex;gap:.45vw;flex:none;margin-left:1vw}
#dots .cnt{font-size:1.3vh;letter-spacing:.12em;color:var(--mute);font-weight:600}
#dots i{width:.55vw;height:.55vw;border-radius:50%;background:rgba(255,255,255,.2);transition:.4s}
#dots i.on{background:var(--accent2);width:1.5vw;border-radius:1vw}
#mbody{flex:1;min-height:0;position:relative}
#list{position:absolute;inset:0;overflow:hidden;display:flex;flex-direction:column;gap:1vh;transition:opacity .45s,transform .45s}
#list.out,#traffic.out{opacity:0;transform:translateY(1.2vh)}
#traffic{position:absolute;inset:0;overflow:hidden;border-radius:14px;border:1px solid rgba(201,149,92,.4);visibility:hidden;background:#cfe3ee;transition:opacity .45s,transform .45s}
#traffic iframe{position:absolute;width:1600px;height:1600px;left:50%;top:50%;margin:-800px 0 0 -800px;border:0;pointer-events:none}
#tidx{position:absolute;left:1vw;right:1vw;top:1.2vh;background:rgba(27,29,29,.94);border:1px solid rgba(201,149,92,.35);border-radius:12px;padding:1vh 1vw;display:none;align-items:center;flex-wrap:wrap;gap:.8vh 1vw}
#tidx.on{display:flex}
#tidx .big{font-size:5.4vh;font-weight:700;line-height:1;color:var(--tc,#3ecf4a);min-width:3.2ch}
#tidx .big i{font-style:normal;font-size:2.6vh;margin-left:.1vw}
#tidx .lab{flex:1;min-width:0}
#tidx .lab b{display:block;white-space:nowrap;font-size:1.5vh;letter-spacing:.12em;text-transform:uppercase;color:var(--tc,#3ecf4a);font-weight:700}
#tidx .lab small{display:block;white-space:nowrap;font-size:1.2vh;letter-spacing:.08em;color:var(--mute);margin-top:.3vh}
#tidx .sub{flex:1 0 100%;display:grid;grid-template-columns:1fr 1fr;gap:.8vw}
#tidx .sub div{display:flex;justify-content:space-between;align-items:center;padding:.5vh .8vw;border-radius:8px;background:rgba(255,255,255,.06)}
#tidx .sub small{display:block;font-size:1.05vh;letter-spacing:.14em;color:var(--mute);text-transform:uppercase}
#tidx .sub strong{font-size:2.4vh;font-weight:700;color:var(--c)}
#tlegend{position:absolute;left:1vw;right:1vw;bottom:1.2vh;background:rgba(27,29,29,.82);border-radius:10px;padding:.8vh .9vw;display:flex;align-items:center;gap:.8vw;font-size:1.25vh;letter-spacing:.12em;text-transform:uppercase;color:var(--soft);font-weight:600}
#tlegend i{flex:1;height:.9vh;border-radius:1vh;background:linear-gradient(90deg,#3ecf4a,#f2c230,#ee3b2f,#8b1a14)}
.m{position:relative;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:2.4vh .8vw 2.3vh;flex:none}
.m .dayl{position:absolute;top:.9vh;left:.9vw;font-size:1.1vh;letter-spacing:.18em;text-transform:uppercase;color:var(--mute);font-weight:500}
.m .chn{position:absolute;right:.8vw;bottom:.7vh;font-size:1.15vh;font-weight:600;letter-spacing:.06em;color:var(--accent2);max-width:70%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbl{display:flex;flex-direction:column;gap:.25vh;height:100%}
.th,.trw{display:grid;grid-template-columns:2.6vh 1fr repeat(4,2.9vh) 4vh 4vh;align-items:center;gap:.25vw;padding:0 .6vw}
.th{height:3vh;flex:none;font-size:1.15vh;letter-spacing:.14em;color:var(--mute);font-weight:600;text-align:center}
.th span:nth-child(2){text-align:left}
.trw{flex:1 1 0;min-height:2.65vh;max-height:4.8vh;border-radius:8px;background:rgba(255,255,255,.035);font-size:1.45vh;text-align:center}
.trw:nth-child(odd){background:rgba(255,255,255,.065)}
.trw .rk{font-weight:700;color:var(--mute)}
.trw.top1{background:linear-gradient(90deg,rgba(201,149,92,.3),rgba(201,149,92,.08))}
.trw.top1 .rk{color:var(--accent2)}
.trw .tn{display:flex;align-items:center;gap:.6vw;text-align:left;min-width:0;font-weight:600}
.trw .tn img{width:2.1vh;height:2.1vh;object-fit:contain;flex:none}
.trw .tn b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.trw .pt{font-weight:800;color:var(--white)}
position:absolute;top:.8vh;right:.8vw}
.pill{font-weight:700;letter-spacing:.08em;padding:.25vh .6vw;border-radius:2vh;background:rgba(255,255,255,.08);color:var(--soft);font-size:1.15vh;white-space:nowrap}
.pill.live{background:rgba(255,77,77,.16);color:var(--live)}
.pill.live::before{content:"";display:inline-block;width:.5vh;height:.5vh;margin-right:.45vw;border-radius:50%;background:var(--live);animation:pulse 1.2s infinite}
.pill.fin{background:rgba(144,101,56,.3);color:var(--accent2)}
@keyframes pulse{50%{opacity:.25}}
.tr3{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:.5vw}
.tbox{display:flex;flex-direction:column;align-items:center;gap:.5vh;min-width:0;text-align:center}
.tbox .lg{width:4.4vh;height:4.4vh;border-radius:50%;background:rgba(255,255,255,.92);display:flex;align-items:center;justify-content:center;flex:none}
.tbox .lg img{width:3.2vh;height:3.2vh;object-fit:contain}
.tbox .nm{font-size:1.6vh;font-weight:600;line-height:1.2;min-height:3.84vh;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;max-width:100%;overflow-wrap:anywhere}
.tbox.lose .nm{color:var(--mute);font-weight:500}
.mid{min-width:9vh;text-align:center}
.mid .tm{display:inline-block;font-size:2.3vh;font-weight:700;letter-spacing:.06em;background:rgba(255,255,255,.08);padding:.7vh .9vw;border-radius:2vh}
.mid .sc{font-size:3.6vh;font-weight:800;letter-spacing:.04em;white-space:nowrap}
.mid .sc i{font-style:normal;color:var(--mute);margin:0 .25vw;font-weight:400}
.mid .sc.fin{color:var(--accent2)}
#rates{flex:none;background:linear-gradient(160deg,rgba(201,149,92,.16),rgba(255,255,255,.03));border:1px solid rgba(201,149,92,.35);border-radius:14px;padding:1.1vh 1vw;display:flex;flex-direction:column;gap:.9vh}
#wx{display:flex;align-items:center;gap:.9vw}
#wx .wi{font-size:4.6vh;line-height:1}
#wx .wt{font-size:4vh;font-weight:600;line-height:1}
#wx .wd{flex:1;min-width:0}
#wx .wd b{display:block;font-size:1.7vh;font-weight:600;color:var(--white)}
#wx .wd small{display:block;font-size:1.3vh;color:var(--mute);margin-top:.3vh;letter-spacing:.04em}
#wx .city{font-size:1.2vh;letter-spacing:.28em;color:var(--accent2);font-weight:600;text-transform:uppercase;text-align:right}
#wx .city small{display:block;letter-spacing:.04em;color:var(--mute);font-weight:400;text-transform:none;margin-top:.3vh;font-size:1.2vh}
#rrow{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);padding-top:.9vh}
#rrow div{text-align:center;border-right:1px solid var(--line)}
#rrow div:last-child{border:0}
#rrow small{display:block;font-size:1.1vh;letter-spacing:.22em;color:var(--accent2);font-weight:600}
#rrow strong{font-size:2.1vh;font-weight:600;white-space:nowrap}
#rrow strong i{font-style:normal;font-size:1.3vh;color:var(--mute);margin-left:.15vw;font-weight:400}
#goal{position:absolute;inset:0;z-index:6;border-radius:16px;overflow:hidden;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:2vh 1.2vw;
background:radial-gradient(120% 90% at 50% 0%,#b07a45 0%,#5b3b1d 45%,#1d1713 100%);border:1px solid rgba(255,230,190,.6);box-shadow:0 0 6vh rgba(201,149,92,.55)}
#goal.in{display:flex;animation:gin .7s cubic-bezier(.2,1.3,.4,1) both}
#goal.out{display:flex;animation:gout .5s ease-in both}
@keyframes gin{from{transform:translateX(110%) scale(.85);opacity:0}to{transform:none;opacity:1}}
@keyframes gout{to{transform:translateX(110%);opacity:0}}
#goal .ball{font-size:7vh;animation:spin 2.4s linear infinite;line-height:1}
@keyframes spin{to{transform:rotate(360deg)}}
#goal h3{font-size:8.5vh;font-weight:800;letter-spacing:.12em;color:#fff;text-shadow:0 .6vh 2vh rgba(0,0,0,.5);animation:pop 1s ease-in-out infinite;margin:.6vh 0 .2vh}
@keyframes pop{50%{transform:scale(1.08)}}
#goal .lg{font-size:1.5vh;letter-spacing:.3em;text-transform:uppercase;color:#ffe9c7;font-weight:600}
#goal .teams{width:100%;margin-top:2vh;background:rgba(0,0,0,.35);border-radius:14px;padding:1.4vh 1.2vw;display:flex;flex-direction:column;gap:.8vh}
#goal .tr{display:flex;justify-content:space-between;align-items:center;font-size:3vh;font-weight:500;color:#e8dcc8;gap:1vw}
#goal .tr span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#goal .tr b{font-size:4vh;font-weight:800;min-width:2ch;text-align:right}
#goal .tr.sc{color:#fff;font-weight:700}
#goal .tr.sc b{color:#ffd58a;animation:pop .8s ease-in-out infinite}
#goal .who{margin-top:2.4vh;font-size:3.4vh;font-weight:700;color:#fff;line-height:1.2}
#goal .who small{display:block;margin-top:.6vh;font-size:2.2vh;font-weight:500;color:#ffe9c7;letter-spacing:.08em}
.cf{position:absolute;top:-4vh;width:1vh;height:1.6vh;opacity:.9;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
#reviews{grid-row:2;grid-column:1;display:none;margin:0 1vw 1.6vh 2vw;height:9.5vh;border-radius:14px;background:linear-gradient(160deg,rgba(201,149,92,.14),rgba(255,255,255,.03));border:1px solid rgba(201,149,92,.35);align-items:center;gap:1.4vw;padding:0 1.6vw;overflow:hidden;transition:opacity .45s,transform .45s}
#reviews.on{display:flex}
#reviews.out{opacity:0;transform:translateY(1vh)}
#reviews .g{flex:none;text-align:center;line-height:1}
#reviews .g b{display:block;font-size:2.8vh;color:#4285f4;font-weight:700;letter-spacing:.02em}
#reviews .g small{font-size:1.1vh;letter-spacing:.2em;color:var(--mute);text-transform:uppercase}
#reviews .stars{flex:none;font-size:3.2vh;color:#f5b73b;letter-spacing:.1vw;text-shadow:0 0 1.4vh rgba(245,183,59,.4)}
#reviews .q{flex:1;min-width:0;font-size:2.3vh;font-weight:500;line-height:1.3;color:var(--white);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
#reviews .who{flex:none;max-width:16vw;text-align:right;font-size:1.8vh;font-weight:600;color:var(--accent2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#ticker{grid-row:3;grid-column:1/3;display:flex;align-items:stretch;background:linear-gradient(180deg,#171919,#0e0f0f);border-top:1px solid rgba(201,149,92,.55);overflow:hidden;position:relative}
#tclock{flex:none;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:0 1.8vw;background:linear-gradient(90deg,#906538,#b07a45);color:#fff;position:relative;z-index:2;line-height:1.05}
#tclock b{font-size:3.4vh;font-weight:700;letter-spacing:.05em;font-variant-numeric:tabular-nums}
#tclock small{font-size:1.2vh;letter-spacing:.14em;text-transform:uppercase;opacity:.95;margin-top:.35vh;white-space:nowrap}
#tlabel{flex:none;display:flex;align-items:center;gap:.5vw;padding:0 1.3vw;background:#181a1a;color:var(--accent2);font-size:1.3vh;font-weight:700;letter-spacing:.2em;text-transform:uppercase;position:relative;z-index:2;box-shadow:1vw 0 2vw rgba(0,0,0,.5);white-space:nowrap}
#tlabel::before{content:"";width:.8vh;height:.8vh;border-radius:50%;background:var(--accent2);animation:pulse 1.2s infinite}
#tview{flex:1;overflow:hidden;display:flex;align-items:center;mask-image:linear-gradient(90deg,transparent,#000 3%,#000 97%,transparent)}
#ttrack{display:flex;flex:none;white-space:nowrap;animation:tscroll 60s linear infinite;will-change:transform}
#ttrack>div{display:flex;align-items:center;flex:none}
@keyframes tscroll{to{transform:translateX(-50%)}}
.ti{display:flex;align-items:center;gap:.8vw;font-size:2.7vh;font-weight:500;padding:0 2.4vw;color:var(--white)}
.ti .lg{font-size:1.6vh;letter-spacing:.2em;color:var(--accent2);font-weight:600;text-transform:uppercase}
.ti .sc{font-weight:700;background:rgba(255,255,255,.1);padding:.3vh 1vw;border-radius:1vh;font-size:2.7vh}
.ti .lv{color:#ff5a5a;font-weight:600;font-size:1.8vh;letter-spacing:.08em}
.ti .ft{color:var(--mute);font-size:1.8vh;letter-spacing:.08em}
.ti::after{content:"◆";color:var(--accent);font-size:1.3vh;margin-left:2.4vw}
#bday{position:fixed;left:0;right:0;bottom:0;height:11vh;background:linear-gradient(90deg,#4a2f18,var(--accent) 50%,#4a2f18);border-top:1px solid var(--soft);display:none;align-items:center;overflow:hidden;z-index:5}
#bday.on{display:flex}
#bday p{white-space:nowrap;font-size:5.4vh;font-weight:600;color:var(--white);padding-left:100%;animation:slide var(--d,20s) linear infinite}
@keyframes slide{to{transform:translateX(-100%)}}
</style></head><body>
<div id="app">
  <div id="stage"><div id="frame"><div id="bgw"><canvas id="bgc"></canvas></div><video id="v" autoplay muted playsinline></video><img id="img" alt=""></div></div>
  <div id="side">
    <div id="logo"></div>
    <div id="matches"><div id="goal"></div><div id="mhead"><h2 id="mtitle">Maçlar</h2><div id="dots"></div></div><div id="mbody"><div id="list"></div><div id="traffic"><iframe loading="eager" referrerpolicy="no-referrer"></iframe><div id="tidx"></div><div id="tlegend"><span>Akıcı</span><i></i><span>Yoğun</span></div></div></div></div>
    <div id="rates"></div>
  </div>
  <div id="reviews"></div>
  <div id="ticker"><div id="tclock"><b id="tc-time">--:--</b><small id="tc-date"></small></div><div id="tlabel"><span id="tl">Canlı Skorlar</span></div><div id="tview"><div id="ttrack"><div id="ta"></div><div id="tb"></div></div></div></div>
</div>
<div id="bday"><p id="btxt"></p></div>
<script>
const v = document.getElementById('v'), img = document.getElementById('img');
let videos = [], idx = 0, current = null, imageSeconds = 10, timer;
function next() { clearTimeout(timer); idx++; play(); }
function play() {
  clearTimeout(timer);
  if (!videos.length) return;
  idx %= videos.length;
  const it = videos[idx];
  current = it.id;
  if (it.type === 'image') {
    v.pause(); v.style.display = 'none'; img.style.display = 'block'; img.src = it.url;
    timer = setTimeout(next, imageSeconds * 1000);
  } else {
    img.style.display = 'none'; v.style.display = 'block'; v.src = it.url;
    v.loop = videos.length === 1;
    v.play().catch(() => {});
  }
}
const bgc = document.getElementById('bgc'), bctx = bgc.getContext('2d');
function sizeBg() { const f = document.getElementById('frame'); bgc.width = 64; bgc.height = Math.max(8, Math.round(64 * f.clientHeight / Math.max(1, f.clientWidth))); }
function drawBg(src, iw, ih) {
  if (!iw || !ih) return;
  const s = Math.max(bgc.width / iw, bgc.height / ih), w = iw * s, hh = ih * s;
  bctx.drawImage(src, (bgc.width - w) / 2, (bgc.height - hh) / 2, w, hh);
}
sizeBg();
addEventListener('resize', () => { sizeBg(); if (img.style.display === 'block') drawBg(img, img.naturalWidth, img.naturalHeight); });
img.addEventListener('load', () => drawBg(img, img.naturalWidth, img.naturalHeight));
setInterval(() => { if (v.style.display !== 'none' && !v.paused && v.readyState >= 2) drawBg(v, v.videoWidth, v.videoHeight); }, 250);
v.addEventListener('ended', next);
v.addEventListener('error', () => { clearTimeout(timer); timer = setTimeout(next, 2000); });

const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let PER_PAGE = 5; const PAGE_MS = 9000, TRAFFIC_MS = 14000;
const TRAFFIC_URL = 'https://yandex.com.tr/map-widget/v1/?ll=28.95%2C41.04&z=10&l=map%2Ctrf&lang=tr_TR';
const PIN = new URLSearchParams(location.search).get('p');
let matches = [], page = 0, pages = [], rot, trafficLoaded = 0;
function team(name, logo, lose) {
  const img = logo ? `<img src="${esc(logo)}" alt="" referrerpolicy="no-referrer" onerror="this.parentNode.style.visibility='hidden'">` : '';
  return `<div class="tbox ${lose ? 'lose' : ''}"><div class="lg">${img}</div><div class="nm">${esc(name)}</div></div>`;
}
function card(m) {
  const hasScore = m.hs != null;
  const hw = hasScore && +m.hs > +m.as, aw = hasScore && +m.as > +m.hs;
  const corner = m.live ? `<span class="pill live">CANLI ${esc(m.clock || '')}</span>` : m.final ? '<span class="pill fin">MS</span>' : '';
  const dayl = !m.live && !m.final ? `<span class="dayl">${esc(m.day)}</span>` : '';
  const mid = hasScore ? `<div class="sc ${m.final ? 'fin' : ''}">${esc(m.hs)}<i>-</i>${esc(m.as)}</div>` : `<div class="tm">${esc(m.time)}</div>`;
  const chn = m.channel ? `<span class="chn">📺 ${esc(m.channel)}</span>` : '';
  return `<div class="m">${dayl}<span class="corner">${corner}</span><div class="tr3">${team(m.home, m.hl, m.final && aw)}<div class="mid">${mid}</div>${team(m.away, m.al, m.final && hw)}</div>${chn}</div>`;
}
let standingsData = {}, showStandings = true, TROWS = 10;
function tableHtml(rows) {
  return '<div class="tbl"><div class="th"><span>#</span><span>Takım</span><span>O</span><span>G</span><span>B</span><span>M</span><span>AV</span><span>P</span></div>' +
    rows.map(r => `<div class="trw ${r.rank === 1 ? 'top1' : ''}"><span class="rk">${esc(r.rank)}</span><span class="tn">${r.logo ? `<img src="${esc(r.logo)}" alt="" referrerpolicy="no-referrer" onerror="this.style.visibility='hidden'">` : ''}<b>${esc(r.name)}</b></span><span>${esc(r.gp)}</span><span>${esc(r.w)}</span><span>${esc(r.d)}</span><span>${esc(r.l)}</span><span>${esc(r.gd)}</span><span class="pt">${esc(r.pts)}</span></div>`).join('') + '</div>';
}
function fit() {
  const list = document.getElementById('list');
  list.style.display = 'flex';
  list.innerHTML = card({home: 'x', away: 'x', hs: 0, as: 0, final: true, day: 'x'});
  const ch = list.firstElementChild.getBoundingClientRect().height + 2;
  const gap = parseFloat(getComputedStyle(list).rowGap) || 0;
  PER_PAGE = Math.max(1, Math.floor((list.clientHeight + gap) / (ch + gap)));
  const vh = innerHeight / 100;
  TROWS = Math.max(5, Math.floor((list.clientHeight - 3.3 * vh) / (2.9 * vh)));
}

let tickKey = '';
function setTicker(list) {

function setState(s) {

const tcol = v => v <= 20 ? '#3ecf4a' : v <= 40 ? '#e6c229' : v <= 60 ? '#f08a24' : '#ee3b2f';

function connect() {
